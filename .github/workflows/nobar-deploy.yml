name: nobar-deploy
# Tests, builds and deploys the "nobar" watch-together app (folder nobar/) to Cloudflare Workers.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Optional: TURN_KEY_ID, TURN_KEY_API_TOKEN.
# The XAUUSD site (Vercel) is not touched by this workflow.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/webrtc-watch-together-app-2v8vdz]
    paths: ['nobar/**', '.github/workflows/nobar-deploy.yml']

concurrency:
  group: nobar-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nobar
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nobar/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum diisi di Settings > Secrets. Build lolos, deploy dilewati."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Set TURN secrets (optional)
        if: steps.cf.outputs.ready == 'true'
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
        run: |
          if [ -n "$TURN_KEY_ID" ] && [ -n "$TURN_KEY_API_TOKEN" ]; then
            printf '%s' "$TURN_KEY_ID" | npx wrangler secret put TURN_KEY_ID
            printf '%s' "$TURN_KEY_API_TOKEN" | npx wrangler secret put TURN_KEY_API_TOKEN
          else
            echo "TURN tidak diatur: aplikasi memakai STUN saja."
          fi
